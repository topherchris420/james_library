# cargo-deny configuration — v2 schema
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# CI runs advisories via both cargo-audit / rustsec-audit-check (vulnerability
# advisories) and cargo-deny (unmaintained + yanked crate detection).
# In v2, vulnerability advisories always emit errors (not configurable).
# unmaintained: scope of unmaintained-crate checks (all | workspace | transitive | none)
unmaintained = "all"
# yanked: deny | warn | allow
yanked = "deny"
# Ignore known unmaintained transitive deps we cannot easily replace
ignore = [
    # bincode v2.0.1 via probe-rs — project ceased but 1.3.3 considered complete
    "RUSTSEC-2025-0141",
    { id = "RUSTSEC-2024-0384", reason = "Reported to `rust-nostr/nostr` and it's WIP" },
    { id = "RUSTSEC-2024-0388", reason = "derivative via extism → wasmtime transitive dep" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash via extism → wasmtime transitive dep" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix via indicatif — cosmetic dep" },
    # wasmtime vulns via extism 1.13.0 — no upstream fix yet; plugins feature-gated
    { id = "RUSTSEC-2026-0006", reason = "wasmtime segfault via extism; awaiting extism upgrade" },
    { id = "RUSTSEC-2026-0020", reason = "WASI resource exhaustion via extism; awaiting extism upgrade" },
    { id = "RUSTSEC-2026-0021", reason = "WASI http fields panic via extism; awaiting extism upgrade" },
    # rustls-webpki CRL matching bug — transitive via rumqttc; no upstream fix yet
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki CRL bug via rumqttc; awaiting rumqttc upgrade" },
    # rustls-pemfile unmaintained — latest version 2.2.0, no replacement available
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; latest version, no alternative" },
    # proc-macro-error2 unmaintained — transitive via matrix-sdk (aquamarine,
    # matrix-pickle-derive); advisory states no safe upgrade is available
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 via matrix-sdk; awaiting matrix-sdk upgrade" },
    # Reviewed 2026-09-11: matrix-sdk 0.16.1 and eyeball-im 0.8 require imbl 6.1,
    # which still depends on bitmaps. Remove when the SDK adopts imbl >=7.0.2.
    # Upstream tracking: https://github.com/matrix-org/matrix-rust-sdk/issues/6859
    { id = "RUSTSEC-2026-0247", reason = "bitmaps unmaintained via optional matrix-sdk; awaiting SDK migration to imbl 7" },
    # Reviewed 2026-09-22: panic-safety double-free in imbl-sized-chunks <0.2.0.
    # imbl 6.1.0 (required by matrix-sdk 0.16.1 and eyeball-im 0.8) depends on
    # imbl-sized-chunks ^0.1.3, so `cargo update -p imbl-sized-chunks` cannot
    # reach the patched 0.2.0 release. That release ships with imbl 7.0.2, which
    # matrix-sdk 0.19.1 pulls, but 0.19.1 sets rust-version 1.96. CI is pinned
    # to Rust 1.92 and this crate's rust-version is 1.87, so the SDK bump would
    # fail `cargo check --all-features` until the toolchain moves. Reachable
    # only if an element's Drop panics during Chunk/InlineArray removal, and
    # only through the optional channel-matrix feature. Remove together with
    # the matrix-sdk 0.19 / imbl 7 migration.
    # Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0292.html
    { id = "RUSTSEC-2026-0292", reason = "imbl-sized-chunks 0.1.3 via matrix-sdk 0.16.1; patched imbl 7 needs matrix-sdk 0.19 and Rust 1.96" },
    # Reviewed 2026-09-11: nostr-relay-pool 0.44.3 contains the security fixes.
    # Remove when the Nostr channel migrates to nostr-sdk >=0.45, which replaces
    # the standalone pool and changes the signer and notification APIs.
    # Upstream notice: https://rustsec.org/advisories/RUSTSEC-2026-0243.html
    { id = "RUSTSEC-2026-0243", reason = "standalone pool unmaintained; patched 0.44.3 retained until optional Nostr SDK migration" },
    # ttf-parser unmaintained — transitive via pdf-extract → lopdf; advisory
    # states no safe upgrade is available (lopdf has not migrated to skrifa)
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via pdf-extract → lopdf; awaiting lopdf migration off ttf-parser" },
]

[licenses]
# All licenses are denied unless explicitly allowed
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
unused-allowed-license = "allow"

# `unescaper` advertises `GPL-3.0/MIT`, which is not a valid SPDX expression.
# Clarify it to the actual dual-license intent so cargo-deny can process the
# dependency instead of failing on the malformed metadata from a transitive crate.
[[licenses.clarify]]
name = "unescaper"
version = "0.1.8"
expression = "MIT OR GPL-3.0-or-later"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
