[package]
name = "buzz-agent"
version = "0.1.0"
# Ported from block/buzz (Apache-2.0). Kept on edition 2021 -- the upstream
# source targets 2021 and the workspace root's edition 2024 is not source
# compatible. Editions are per-crate, so this is intentional, not drift.
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/block/buzz"
description = "Minimal, unbreakable ACP-compliant agent. Non-streaming. Tool-calls-as-output."
readme = "README.md"
keywords = ["acp", "agent", "llm", "mcp", "minimal"]
categories = ["command-line-utilities", "web-programming"]
publish = false

[lib]
name = "buzz_agent"
path = "src/lib.rs"

[[bin]]
name = "buzz-agent"
path = "src/main.rs"

# Test-only fake MCP server. Built unconditionally because cargo can't gate
# bins on `cfg(test)`, but it's tiny and only used by integration tests.
[[bin]]
name = "fake-mcp"
path = "tests/bin/fake_mcp.rs"

# Upstream resolved these through block/buzz's [workspace.dependencies].
# R.A.I.N.'s root manifest has no [workspace.dependencies] table, so every
# dependency is pinned explicitly here. Where upstream and R.A.I.N. disagreed
# on a version, R.A.I.N.'s version wins so cargo unifies one copy instead of
# building two major versions into the same dependency graph:
#   reqwest 0.13 -> 0.12 (feature "rustls" is spelled "rustls-tls" in 0.12)
#   sha2    0.11 -> 0.10
# Only Client/RequestBuilder/Response/StatusCode/.form()/.json() and
# Digest/Sha256 are used, all stable across those ranges.
[dependencies]
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "process", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1", default-features = false, features = ["client", "transport-child-process"] }
arc-swap = "1"
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OAuth 2.0 PKCE for Databricks (and future browser-auth providers).
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
urlencoding = "2"
webbrowser = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
tokio = { version = "1.50", features = ["test-util", "rt-multi-thread", "macros", "io-std", "io-util", "sync", "process", "time", "net"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
axum = { version = "0.8", features = ["ws", "macros"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
